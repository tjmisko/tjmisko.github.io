<span class="arc-pop-phases">
  {%- for ph in include.phases -%}
    {%- assign cadence = ph.cadence | default: "active" -%}
  <span class="arc-pop-phase is-{{ cadence }}" data-phase="{{ forloop.index }}">
    <small class="arc-pop-span">{{ ph.span }}</small>
    {%- if ph.note %}<small>{{ ph.note }}</small>{% endif -%}
  </span>
  {%- endfor -%}
</span>
