# Waterfall for the Trajectory card (see _layouts/home.html), drawn on a ruler
# running from 2020 to today; each tool is one bar. "Today" is resolved from
# site.time when the site is built, so the now line moves with each publish and
# no date here has to stand in for it.
#
# All the entries under `views` share one tab and one grid, so they read against
# the same time axis. The first is the chart proper. Each one after it is a minor
# band below a divider, drawn at reduced weight — context rather than argument,
# so add a view here only for something meant to sit under the main story.
#
#   start / end   real dates, yyyy-mm-dd. The grid's columns are half-years, so
#                 a bar's edges snap to the nearest half-year line — Jan 1 and
#                 Jul 1 land exactly; segment boundaries inside a bar keep their
#                 exact date positions. Anything starting before 2020 is clamped
#                 to the left edge and drawn clipped; keep the display dates in
#                 `span`. An end on or before its start fails the build, as does
#                 a `continues` bar starting before the previous bar's end.
#   ongoing       true if still in use. The bar then runs to the computed now
#                 line and `end` is not read — leave it off rather than writing
#                 a date that will go stale.
#   occasional    true for reach-for-it-sometimes tools (hatched, dimmer) —
#                 shorthand for a single occasional segment covering the bar.
#   segments      optional list of phases within one bar, for tools whose use
#                 has waxed and waned. Solid fill = daily driver, diagonal
#                 hatch = reached for occasionally. Each phase takes:
#                   start     yyyy-mm-dd date the phase begins
#                   end       optional — defaults to the next phase's start, so
#                             a contiguous history only dates each turn
#                   cadence   daily (default) or occasional
#                   ongoing   true on the last phase if it runs to now
#                   span      display string for the phase popover's date line
#                   note      a sentence on what was going on in that phase
#                 When segments are present the bar's extent derives from them
#                 (first start → last end/now), and tool-level start / end /
#                 ongoing are not read. Keep the tool-level span and note: they
#                 head the tool's card in the mobile feed.
#                 Phases must be in date order and disjoint (touching is fine,
#                 gaps are fine), only the last may be ongoing, and the last
#                 must either end or be ongoing. Any violation fails the build
#                 with a missing-include error naming the tool and the rule.
#   continues     true to share the previous tool's row instead of starting a
#                 new one. For things you switch between rather than accumulate
#                 (editors, operating systems) the spans don't overlap, so a
#                 staircase would be misleading — they belong on one row as a
#                 relay of segments. Set it on every entry after the first.
#   link          optional URL. The bar becomes that link — the whole bar, in a
#                 new tab — instead of a plain span, so say where it goes in the
#                 `note`. Not available to a bar with segments: those are
#                 focusable in their own right, and nesting them inside a link
#                 fails the build.
#   family        `analysis`, `language`, or `environment`; drives bar color
#                 through .arc-chip--<family>. There is no color key — the bar
#                 names carry the distinction — so adding a family here means
#                 adding a rule for it in _sass/arc.scss.
#   span / note   display strings for the hover popover (and the mobile feed).
#
# Bars render top-to-bottom in file order, so keep each group roughly
# chronological by `start`. Adding a group — or a whole band — is a change here
# only; rows, rail labels, and dividers are all derived.

views:
  - id: tools
    tab: Tools
    throughline: >-
      The stack accumulates rather than rotates: spreadsheets and stats packages for research
      questions, general-purpose languages to build the systems, then the layer underneath them.
    groups:
      - group: Computing
        tools:
          - name: Excel / Google Sheets
            family: analysis
            span: 2018 – now
            note: Modeling, case exhibits, and everyday analysis.
            segments:
              - start: 2018-01-01
                cadence: daily
                span: 2018 – 2024
                note: Modeling, case exhibits, and everyday analysis through BRG.
              - start: 2024-07-01
                cadence: occasional
                ongoing: true
                span: 2024 – now
                note: Still where a quick table or a shared sheet goes, but the analysis itself moved into code.

          - name: R
            family: analysis
            span: 2020 – 2025
            note: Econometrics and causal inference — regressions, panel data, ggplot.
            segments:
              - start: 2020-01-01
                cadence: daily
                span: 2020 – mid-2023
                note: The analysis language through the SSPI research years — regressions, panel data, ggplot.
              - start: 2023-07-01
                end: 2026-01-01
                cadence: occasional
                span: mid-2023 – 2025
                note: Stata took the case work at BRG, but R stayed in reach for a plot or a quick model — on and off until the SSPI work wrapped at the end of 2025.

          - name: Stata
            family: analysis
            start: 2023-07-01
            end: 2024-07-01
            span: 2023 – 2024
            note: Antitrust econometrics at BRG, on the case teams that used it.

          - name: Python
            family: language
            span: 2020 – now
            note: Primary language. ETL pipelines, Flask backends, CLIs, analysis.
            segments:
              - start: 2020-07-01
                cadence: daily
                span: mid-2020 – end 2020
                note: Picked up for SSPI data work — the first collection scripts and ETL pipelines.
              - start: 2021-01-01
                cadence: occasional
                span: "2021"
                note: On and off through 2021 — reached for when the research needed a script, while R carried the analysis.
              - start: 2022-01-01
                cadence: daily
                span: 2022 – 2025
                note: Every day for four years — the sspi.world Flask backend, ETL pipelines, CLIs.
              - start: 2026-01-01
                cadence: occasional
                ongoing: true
                span: 2026 – now
                note: Still the language I think in, now reached for on and off — agent fleets write most of the routine Python to spec.

          - name: HTML / CSS / JavaScript
            family: language
            span: 2022 – now
            note: Browser interfaces — the sspi.world front end, charts, this site.
            segments:
              - start: 2022-01-01
                cadence: daily
                span: 2022 – mid-2025
                note: Hand-written browser interfaces — the sspi.world front end, the charts, this site.
              - start: 2025-07-01
                cadence: occasional
                ongoing: true
                span: mid-2025 – now
                note: Mostly agent-driven since — I set the structure and review the result rather than typing the markup and styles.

          - name: Bash
            family: language
            start: 2023-07-01
            span: 2023 – now
            ongoing: true
            note: The locus of work shifted to the terminal in 2023; bash is the <i>lingua franca</i> of daily computing tasks, integrating naturally into the Vim, Obsidian, and plaintext tools ecosystem. I issue commands, use CLIs, and write scripts including the first iteration of Taskbuffer. The depth in writing and reading Bash has become doubly handy in the era of coding agents, making supervision at a glance effortless.

          - name: TypeScript
            family: language
            start: 2024-01-01
            span: 2024 – now
            ongoing: true
            occasional: true
            note: Occasional — typed front ends and tooling where the types earn their keep.

          - name: Go
            family: language
            span: 2024 – now
            note: Concurrent daemons and CLIs — Taskbuffer's Go era hand-written; Switchboard's daemon agent-built to my direction.
            segments:
              - start: 2024-07-01
                cadence: daily
                span: mid-2024 – 2025
                note: The opening burst — Taskbuffer's Go rewrite, hand-written end to end.
              - start: 2025-01-01
                cadence: occasional
                span: "2025"
                note: Off the daily rotation for a year — reached for when a job wanted a single static binary, not much else.
              - start: 2026-01-01
                cadence: daily
                ongoing: true
                span: 2026 – now
                note: Back in daily use — Switchboard's daemon, agent-built to my direction.

          - name: C
            family: language
            start: 2024-12-01
            span: late 2024 – now
            ongoing: true
            occasional: true
            note: Occasional — systems fundamentals, memory, pointers, what the layers above sit on.

          - name: Rust
            family: language
            start: 2026-01-01
            span: 2026 – now
            ongoing: true
            note: Current study — ownership, lifetimes, safe systems programming.

  - id: toolchain
    tab: Toolchain
    groups:
      - group: Editor
        tools:
          - name: Atom
            family: environment
            start: 2019-01-01
            end: 2022-01-01
            span: 2019 – 2022
            note: First editor — the coursework and early econometrics years.

          - name: VS Code
            family: environment
            continues: true
            start: 2022-01-01
            end: 2024-01-01
            span: 2022 – 2024
            note: Everyday editor through the SSPI build and the start of BRG.

          - name: Neovim
            family: environment
            continues: true
            start: 2024-01-01
            span: 2024 – now
            ongoing: true
            note: Primary editor, configured from scratch; Lua plugins of my own.

      - group: Notes
        tools:
          - name: Apple Notes
            family: environment
            start: 2018-01-01
            end: 2023-07-01
            span: 2018 – 2023
            note: Default notes app through college and the SSPI research years.

          - name: Obsidian
            family: environment
            continues: true
            start: 2023-07-01
            span: 2023 – now
            ongoing: true
            note: Plain-text notes and linked research knowledge base.

      - group: Terminal
        tools:
          - name: Terminal
            family: environment
            start: 2018-01-01
            end: 2023-10-01
            span: 2018 – late 2023
            occasional: true
            note: The macOS default, taken as it came — a terminal was still just where commands went, not somewhere to work.

          - name: WezTerm
            family: environment
            continues: true
            start: 2023-10-01
            span: late 2023 – now
            ongoing: true
            note: Configured from scratch in Lua, and the same config has followed the machine from Windows to Linux.

      - group: Operating System
        tools:
          - name: macOS
            family: environment
            start: 2018-01-01
            end: 2023-07-01
            span: 2018 – 2023
            note: Personal machine through college and the SSPI research years.

          - name: Windows
            family: environment
            continues: true
            start: 2023-07-01
            end: 2024-07-01
            span: 2023 – 2024
            note: Issued machine at BRG; the case work ran on it.

          - name: Linux
            family: environment
            continues: true
            start: 2024-07-01
            span: 2024 – now
            ongoing: true
            note: Fedora Asahi Remix on Apple Silicon; primary machine since mid-2024.

      - group: AI Tooling
        tools:
          - name: ChatGPT
            family: environment
            start: 2023-07-01
            end: 2025-07-01
            span: 2023 – 2025
            note: Chat window alongside the editor — questions answered, snippets drafted, code pasted back by hand.

          - name: Claude Code
            family: environment
            continues: true
            start: 2025-07-01
            span: 2025 – now
            ongoing: true
            note: Agents in the repo rather than a chat window; now the fleets that built Arachne to my specification.

      - group: Keyboard
        tools:
          - name: ZSA Voyager
            family: environment
            start: 2023-11-01
            span: late 2023 – now
            ongoing: true
            link: https://configure.zsa.io/voyager/layouts/3aeEA/latest/0
            note: Split ergonomic board on Colemak-DH, with custom layers in place of reaching. Opens the layout in ZSA's configurator.
