# Waterfall for the Trajectory card (see _layouts/home.html), drawn on a ruler
# running from 2020 to today; each tool is one bar. "Today" is resolved from
# site.time when the site is built, so the now line moves with each publish and
# no date here has to stand in for it.
#
# All the entries under `views` share one tab and one grid, so they read against
# the same time axis. The first is the chart proper. Each one after it is a minor
# band below a divider, drawn at reduced weight — context rather than argument,
# so add a view here only for something meant to sit under the main story.
#
#   start / end   real dates, yyyy-mm-dd. The grid's columns are half-years, so
#                 a bar's edges snap to the nearest half-year line — Jan 1 and
#                 Jul 1 land exactly; segment boundaries inside a bar keep their
#                 exact date positions. Anything starting before 2020 is clamped
#                 to the left edge and drawn clipped; keep the display dates in
#                 `span`. An end on or before its start fails the build, as does
#                 a `continues` bar starting before the previous bar's end.
#   ongoing       true if still in use. The bar then runs to the computed now
#                 line and `end` is not read — leave it off rather than writing
#                 a date that will go stale.
#   occasional    true for reach-for-it-sometimes tools (hatched, dimmer) —
#                 shorthand for a single occasional segment covering the bar.
#   segments      optional list of phases within one bar, for tools whose use
#                 has waxed and waned. Solid fill = daily driver, diagonal
#                 hatch = reached for occasionally. Each phase takes:
#                   start     yyyy-mm-dd date the phase begins
#                   end       optional — defaults to the next phase's start, so
#                             a contiguous history only dates each turn
#                   cadence   daily (default) or occasional
#                   ongoing   true on the last phase if it runs to now
#                   span      display string for the phase popover's date line
#                   note      a sentence on what was going on in that phase
#                 When segments are present the bar's extent derives from them
#                 (first start → last end/now), and tool-level start / end /
#                 ongoing are not read. Keep the tool-level span and note: they
#                 head the tool's card in the mobile feed.
#                 Phases must be in date order and disjoint (touching is fine,
#                 gaps are fine), only the last may be ongoing, and the last
#                 must either end or be ongoing. Any violation fails the build
#                 with a missing-include error naming the tool and the rule.
#   continues     true to share the previous tool's row instead of starting a
#                 new one. For things you switch between rather than accumulate
#                 (editors, operating systems) the spans don't overlap, so a
#                 staircase would be misleading — they belong on one row as a
#                 relay of segments. Set it on every entry after the first.
#   link          optional URL. The bar becomes that link — the whole bar, in a
#                 new tab — instead of a plain span, so say where it goes in the
#                 `note`. Not available to a bar with segments: those are
#                 focusable in their own right, and nesting them inside a link
#                 fails the build.
#   family        `analysis`, `language`, or `environment`; drives bar color
#                 through .arc-chip--<family>. There is no color key — the bar
#                 names carry the distinction — so adding a family here means
#                 adding a rule for it in _sass/arc.scss.
#   span / note   display strings for the hover popover (and the mobile feed).
#
# Bars render top-to-bottom in file order, so keep each group roughly
# chronological by `start`. Adding a group — or a whole band — is a change here
# only; rows, rail labels, and dividers are all derived.

views:
  - id: tools
    tab: Tools
    throughline: As I've developed my technical skills, I've found myself drawn to tools that reward investment and allow me to configure and shape them to suit my needs.
    groups:
      - group: Computing
        tools:
          - name: Excel / Google Sheets
            family: analysis
            span: 2018 – now
            note: Modeling, case exhibits, and everyday analysis.
            segments:
              - start: 2018-01-01
                cadence: daily
                span: 2018 – 2024
                note: >-
                  Economic modeling, data preparation, case exhibits, and
                  everyday analysis in school, during the early days of SSPI, and
                  at BRG.
              - start: 2024-07-01
                cadence: occasional
                ongoing: true
                span: 2024 – now
                note: >-
                  Still useful for a quick table or a shared sheet.

          - name: R
            family: analysis
            span: 2020 – 2025
            note: Statistics, economics, and causal inference — regressions, panel data, ggplot.
            segments:
              - start: 2020-01-01
                cadence: daily
                span: 2020 – mid-2023
                note: The analysis language through the SSPI research years — regressions, panel data, ggplot.
              - start: 2023-07-01
                end: 2026-01-01
                cadence: occasional
                span: mid-2023 – 2025
                note: Occasionally reached for R for a plot or a quick model until the SSPI work wrapped up in 2025.

          - name: Stata
            family: analysis
            start: 2023-07-01
            end: 2024-07-01
            span: 2023 – 2024
            note: Primary tool for data preparation, analysis, and econometrics work at BRG.

          - name: Python
            family: language
            span: 2020 – now
            note: Primary language. Flask backends, Click CLIs, analysis in pandas, computation in numpy.
            segments:
              - start: 2020-07-01
                cadence: daily
                span: mid-2020 – end 2020
                note: CS 61A coursework and projects.
              - start: 2021-01-01
                cadence: occasional
                span: "2021"
                note: Occasional research tasks.
              - start: 2022-01-01
                cadence: daily
                span: 2022 – 2025
                note: >-
                  Primary language for four years, chosen for the sspi.world Flask
                  backend as a lingua franca that research apprentices already knew
                  from their coursework. Used to build out the ETL pipeline for
                  sspi.world, the website backend, and later the CLI tools.
              - start: 2026-01-01
                cadence: occasional
                ongoing: true
                span: 2026 – now
                note: >-
                  Still useful for ML/AI work, but not a systems language.

          - name: HTML / CSS / JavaScript
            family: language
            span: 2022 – now
            note: Browser interfaces — the sspi.world front end, charts, this site.
            segments:
              - start: 2022-01-01
                cadence: daily
                span: 2022 – mid-2025
                note: Hand-written browser interfaces — the sspi.world front end, the charts, this site.
              - start: 2025-07-01
                cadence: occasional
                ongoing: true
                span: mid-2025 – now
                note: >-
                  I occasionally jump in to fix something simple, but these days I mostly declare the
                  behavior I'd like in natural language and have a coding agent do the rest. The time
                  spent actually understanding the frontend and building things myself makes it easy
                  to steer agents when they go off track.

          - name: Bash
            family: language
            start: 2023-07-01
            span: 2023 – now
            ongoing: true
            note: >-
              The locus of computer work shifted to the terminal in 2023 for me,
              so Bash became the <i>lingua franca</i> of daily computing tasks,
              providing a gateway to the Vim, Obsidian, and plaintext tool
              ecosystem. Some background and depth in writing and reading
              Bash has proved surprisingly handy in the era of coding agents,
              making supervision at a glance effortless.

          - name: TypeScript
            family: language
            start: 2024-01-01
            span: 2024 – now
            ongoing: true
            occasional: true
            note: Occasional typed front ends and tooling, especially for Obsidian plugins; the recent plugins are agent-built to my direction.

          - name: Go
            family: language
            span: 2024 – now
            note: Small single-binary tools since 2024; the daemons — Switchboard, Coldstore — are agent-built to my direction.
            segments:
              - start: 2024-07-01
                cadence: daily
                span: mid-2024 – 2025
                note: Learned a bit of Go to rewrite Taskbuffer, since the bash scripts I'd cobbled together were starting to become painful.
              - start: 2025-01-01
                cadence: occasional
                span: "2025"
                note: Mostly off the daily rotation for a year, used only in maintaining and extending Taskbuffer.
              - start: 2026-01-01
                cadence: daily
                ongoing: true
                span: 2026 – now
                note: >-
                  Back in daily use for Switchboard's daemon. Because Go is so simple,
                  I find it nice to use when outsourcing work to coding agents. It's easy to read, simple to
                  reason about, and hard to screw up.

          - name: C
            family: language
            start: 2024-12-01
            span: late 2024 – now
            ongoing: true
            occasional: true
            note: >-
              I learned C for the same reason I took Latin in school:
              to read the classics, to bring myself into contact with
              the knowledge of the ancients, and for the occasionally
              useful bit of trivia. I've never built anything useful in
              C, but much of what I rely on daily is built in C, and
              understanding the syntax and design of C was crucial to my
              progression as a programmer.

          - name: Rust
            family: language
            start: 2026-01-01
            span: 2026 – now
            ongoing: true
            note: >-
              The language I'm currently learning to think, write, and
              build in, laddering up my understanding by reading and reviewing
              the Rust that agents write for Functionary. A Rust rewrite of
              Switchboard is planned as the first thing I build in it by hand.

  - id: toolchain
    tab: Toolchain
    groups:
      - group: Editor
        tools:
          - name: Atom
            family: environment
            start: 2019-01-01
            end: 2022-01-01
            span: 2019 – 2022
            note: First editor — the coursework, early website work. Rest in peace.

          - name: VSCode
            family: environment
            continues: true
            start: 2022-01-01
            end: 2024-01-01
            span: 2022 – 2024
            note: Everyday editor through the early SSPI build.

          - name: Neovim
            family: environment
            continues: true
            start: 2024-01-01
            span: 2024 – now
            ongoing: true
            note: >-
              Primary editor, picked up as I transitioned into the terminal for
              everyday work in late 2023, with a custom configuration I incrementally
              built out over the course of 2024. When I was a kid I played around a
              ton with 3D modeling in Blender (which also features keyboard driven
              modal editing), so learning the vim keybindings felt oddly like coming
              home.
      - group: Notes
        tools:
          - name: Apple Notes
            family: environment
            start: 2018-01-01
            end: 2023-07-01
            span: 2018 – 2023
            note: Default notes app through college and the SSPI research years.

          - name: Obsidian
            family: environment
            continues: true
            start: 2023-07-01
            span: 2023 – now
            ongoing: true
            note: >-
              I use Obsidian for all of the information I care about: notes, journaling,
              writing, tasks, projects, calendars, recommendations, you name it. I also
              maintain several plugins, mostly for personal use, which implement a
              vim-inspired keyboard-centric workflow for managing tasks (obsidian-taskbuffer),
              calendars (obsidian-keyboard-calendar), and maps (obsidian-vim-map).

      - group: Terminal
        tools:
          - name: Terminal
            family: environment
            start: 2018-01-01
            end: 2023-10-01
            span: 2018 – late 2023
            occasional: true
            note: >-
              The macOS default: who even knew that you could have another option?

          - name: WezTerm
            family: environment
            continues: true
            start: 2023-10-01
            span: late 2023 – now
            ongoing: true
            note: >-
              Basic, configured in Lua, and my daily driver for several years running.

      - group: Operating System
        tools:
          - name: macOS
            family: environment
            start: 2018-01-01
            end: 2023-07-01
            span: 2018 – 2023
            note: Personal machine through college and the SSPI research years.

          - name: Windows
            family: environment
            continues: true
            start: 2023-07-01
            end: 2024-07-01
            span: 2023 – 2024
            note: Issued machine at BRG.

          - name: Linux
            family: environment
            continues: true
            start: 2024-07-01
            span: 2024 – now
            ongoing: true
            note: >-
              Fedora Asahi Remix on Apple Silicon; primary machine since mid-2024.
              The main draw to Linux was configurability. I was tired of fighting my
              operating system and window manager over keybindings, window
              placement, annoying immutable defaults, and other nits. I'm never going
              back.

      - group: Keyboard
        tools:
          - name: ZSA Voyager
            family: environment
            start: 2023-11-01
            span: late 2023 – now
            ongoing: true
            link: https://configure.zsa.io/voyager/layouts/3aeEA/latest/0
            note: >-
              Split ergonomic board on Colemak-DH, with custom layers to put arrow keys,
              page up, page down, home, and end keys, and a number pad all under my right hand,
              ready whenever I need them.
