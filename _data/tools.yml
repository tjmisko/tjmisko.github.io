# Waterfall views for the Trajectory card (see _layouts/home.html). Each entry
# under `views` becomes its own tab beside Projects, drawn on the same
# 2018–2026 ruler; each tool under it is one bar.
#
#   start / end   decimal half-years; 2024.5 means mid-2024. They map to grid
#                 columns as (year - 2018) * 2 + 2, so only .0 and .5 land on
#                 a column boundary. `end: 2026.5` is the "now" line.
#   ongoing       true if still in use — draws the bar into the now line.
#   occasional    true for reach-for-it-sometimes tools (dashed, dimmer).
#   continues     true to share the previous tool's row instead of starting a
#                 new one. For things you switch between rather than accumulate
#                 (editors, operating systems) the spans don't overlap, so a
#                 staircase would be misleading — they belong on one row as a
#                 relay of segments. Set it on every entry after the first.
#   family        one of `families` below; drives bar color and the legend,
#                 which is derived per view and hidden when a view uses only
#                 one family.
#   span / note   display strings for the hover popover (and the mobile feed).
#
# Bars render top-to-bottom in file order, so keep each group roughly
# chronological by `start`. Adding a group — or a whole view — is a change
# here only; rows, rail labels, and tabs are all derived.

families:
  - id: analysis
    label: analysis
  - id: language
    label: languages
  - id: environment
    label: environment

views:
  - id: tools
    tab: Tools
    throughline: >-
      The stack accumulates rather than rotates: spreadsheets and stats packages for research
      questions, general-purpose languages to build the systems, then the layer underneath them.
    groups:
      - group: Computing
        tools:
          - name: Excel / Google Sheets
            family: analysis
            start: 2018
            end: 2024.5
            span: 2018 – 2024
            note: Modeling, case exhibits, and everyday analysis through BRG.

          - name: R
            family: analysis
            start: 2020
            end: 2024.5
            span: 2020 – 2024
            note: Econometrics and causal inference — regressions, panel data, ggplot.

          - name: Python
            family: language
            start: 2020.5
            end: 2026.5
            span: 2020 – now
            ongoing: true
            note: Primary language. ETL pipelines, Flask backends, CLIs, analysis.

          - name: Stata
            family: analysis
            start: 2024
            end: 2024.5
            span: 2024
            note: Antitrust econometrics at BRG, on the case teams that used it.

          - name: HTML / CSS / JavaScript
            family: language
            start: 2023
            end: 2026.5
            span: 2023 – now
            ongoing: true
            note: Browser interfaces — the sspi.world front end, charts, this site.

          - name: TypeScript
            family: language
            start: 2024.5
            end: 2026.5
            span: 2024 – now
            ongoing: true
            occasional: true
            note: Occasional — typed front ends and tooling where the types earn their keep.

          - name: Go
            family: language
            start: 2024.5
            end: 2026.5
            span: 2024 – now
            ongoing: true
            note: Concurrent daemons and CLIs — Switchboard, Arachne's process layer.

          - name: C
            family: language
            start: 2025.5
            end: 2026.5
            span: 2025 – now
            ongoing: true
            note: Systems fundamentals — memory, pointers, what the layers above sit on.

          - name: Rust
            family: language
            start: 2026
            end: 2026.5
            span: 2026 – now
            ongoing: true
            note: Current study — ownership, lifetimes, safe systems programming.

  - id: toolchain
    tab: Toolchain
    throughline: >-
      The environment the work happens in — editor, notes, and the machine underneath. It has
      moved steadily toward plain text I own and configuration I wrote myself.
    groups:
      - group: Editors
        tools:
          - name: Atom
            family: environment
            start: 2019
            end: 2022
            span: 2019 – 2022
            note: First editor — the coursework and early econometrics years.

          - name: VS Code
            family: environment
            continues: true
            start: 2022
            end: 2024
            span: 2022 – 2024
            note: Everyday editor through the SSPI build and the start of BRG.

          - name: Vim / Neovim
            family: environment
            continues: true
            start: 2024
            end: 2026.5
            span: 2024 – now
            ongoing: true
            note: Primary editor, configured from scratch; Lua plugins of my own.

      - group: Notes
        tools:
          - name: Apple Notes
            family: environment
            start: 2018
            end: 2023.5
            span: 2018 – 2023
            note: Default notes app through college and the SSPI research years.

          - name: Obsidian
            family: environment
            continues: true
            start: 2023.5
            end: 2026.5
            span: 2023 – now
            ongoing: true
            note: Plain-text notes and linked research knowledge base.

      - group: Operating Systems
        tools:
          - name: macOS
            family: environment
            start: 2018
            end: 2023.5
            span: 2018 – 2023
            note: Personal machine through college and the SSPI research years.

          - name: Windows
            family: environment
            continues: true
            start: 2023.5
            end: 2024.5
            span: 2023 – 2024
            note: Issued machine at BRG; the case work ran on it.

          - name: Linux
            family: environment
            continues: true
            start: 2024.5
            end: 2026.5
            span: 2024 – now
            ongoing: true
            note: Fedora Asahi Remix on Apple Silicon; primary machine since mid-2024.
