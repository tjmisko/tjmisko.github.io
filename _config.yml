title: Tristan Misko
url: https://tristanmisko.com
author:
  name: Tristan Misko
  email: tjmisko@quasioptimal.io
# jekyll-seo-tag: the logo goes into the page's structured data, and the
# social links name the profiles that are also me (sameAs).
logo: /assets/icon-512.png
social:
  name: Tristan Misko
  links:
    - https://github.com/tjmisko
    - https://www.linkedin.com/in/tristanmisko
description: > # this means to ignore newlines until "show_excerpts:"
  Portfolio for my engineering work across AI, software, and data engineering.
show_excerpts: false # set to true to show excerpts on the homepage
# The link-preview image (og:image, twitter:image) for every page that doesn't
# name its own. jekyll-seo-tag reads it from front matter only, hence a default.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: Tristan Misko
collections:
  about:
    output: false
  projects:
    output: false
  # Roles and schooling that place a chip on the Trajectory chart but are not
  # portfolio projects, so they never enter the rolodex. Same front matter as
  # _projects (project-title, -type, -status, -headline, arc) so one card
  # include renders both into the same detail modal.
  experience:
    output: false
  pages:
    output: true
  archives:
    output: true
  bibliography:
    output: true
  sspi-devlog:
    output: true

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"


  # generate social links in footer
  social_links:
    email: tjmisko@quasioptimal.io
    github:  tjmisko
    linkedin: tristanmisko
    spotify: tristanmisko
